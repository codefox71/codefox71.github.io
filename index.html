<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>4-bit Relay CPU — IGP / Bendix-15</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="panel">
    <div class="panel-left">
      <h1 class="title">Bendix-15 Relay CPU</h1>
      <div class="subtitle">4-bit accumulator · 5 words · 4 × 2-bit regs</div>
    </div>
    <div class="panel-right">
      <button id="downloadBtn">Download Standalone</button>
      <button id="powerBtn" class="red">Power</button>
    </div>
  </header>

  <main class="container">
    <section class="left">
      <div class="face">
        <div class="stage">
          <div class="accum display">
            <div class="label">ACC</div>
            <div id="accVal" class="value">0x0</div>
          </div>

          <div class="memory">
            <div class="label">Memory (5 × 4-bit)</div>
            <div id="memList" class="memlist"></div>
          </div>

          <div class="regs">
            <div class="label">Regs (2-bit)</div>
            <div id="regs" class="reglist"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="buttons">
          <button id="stepBtn">Step</button>
          <button id="runBtn">Run</button>
          <button id="stopBtn">Stop</button>
          <button id="resetBtn">Reset</button>
        </div>

        <div class="program">
          <textarea id="program" spellcheck="false"></textarea>
          <div class="prog-actions">
            <button id="loadProg">Load</button>
            <button id="assemble">Assemble</button>
            <label>Speed <input id="speed" type="range" min="100" max="2000" value="500"></label>
          </div>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="decoder card">
        <h3>Decoder / Console</h3>
        <div id="console" class="console"></div>
      </div>

      <div class="serial card">
        <h3>Serial Bus</h3>
        <div id="serialOut" class="serial-out"></div>
        <div class="serial-controls"><button id="clrSerial">Clear</button></div>
      </div>

      <div class="relays card">
        <h3>Relays</h3>
        <div id="relays" class="relays-grid"></div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
